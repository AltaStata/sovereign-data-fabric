syntax = "proto3";

package altastata.v1;

option java_multiple_files = true;
option java_package = "com.altastata.grpc.proto";
option java_outer_classname = "S3CredentialsProto";

import "google/protobuf/timestamp.proto";

// Per-session S3 SigV4 credentials for end users (post-login).
// See altastata-grpc/CONSOLE_ACCOUNT_SETUP_DESIGN.md §7.

service S3CredentialsService {
  rpc IssueCredentials(IssueCredentialsRequest) returns (IssueCredentialsResponse);
  rpc ListMyCredentials(ListMyCredentialsRequest) returns (ListMyCredentialsResponse);
  rpc RevokeCredentials(RevokeCredentialsRequest) returns (RevokeCredentialsResponse);
}

message IssueCredentialsRequest {
  string label = 1;
}

message IssueCredentialsResponse {
  string access_key_id = 1;
  string secret_access_key = 2;
}

message CredentialSummary {
  string access_key_id = 1;
  string label = 2;
  google.protobuf.Timestamp created_at = 3;
}

message ListMyCredentialsRequest {}

message ListMyCredentialsResponse {
  repeated CredentialSummary credentials = 1;
}

message RevokeCredentialsRequest {
  string access_key_id = 1;
}

message RevokeCredentialsResponse {}
