plugins {
    id 'java-library'
    id("io.micronaut.library") version "4.5.1"
}

group = 'com.altastata'
version = rootProject.file('VERSION').text.trim()
sourceCompatibility = '17'

repositories {
    mavenCentral()
    mavenLocal()
}

sourceSets {
    main.java.srcDirs = ["src/main/java"]
    main.resources.srcDirs = ["src/main/resources"]
}

ext {
    micronautVersion = "4.7.6"
}

dependencies {
    implementation(project(':altastata-core')) {
        exclude group: 'com.twitter'
    }
    implementation project(':altastata-grpc')

    annotationProcessor("io.micronaut:micronaut-http-validation")
    annotationProcessor("io.micronaut.serde:micronaut-serde-processor")

    implementation("io.micronaut.serde:micronaut-serde-jackson")
    implementation("io.micronaut.reactor:micronaut-reactor")
    implementation("io.micronaut.reactor:micronaut-reactor-http-client")

    implementation("io.micronaut:micronaut-runtime:$micronautVersion")
    implementation("io.micronaut:micronaut-http-server-netty:$micronautVersion")
    implementation("io.micronaut:micronaut-websocket:$micronautVersion")
    implementation("io.micronaut:micronaut-http-netty:$micronautVersion")
    implementation("io.micronaut:micronaut-http-client:$micronautVersion")

    // Apache Commons for utilities
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'commons-io:commons-io:2.17.0'
    
    // Apache Tika for content type detection
    implementation "org.apache.tika:tika-core:3.2.2"

    runtimeOnly("ch.qos.logback:logback-classic")
    runtimeOnly("org.yaml:snakeyaml")

    // JUnit 5 dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
    
    // Mockito for mocking
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:4.11.0'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

micronaut {
    runtime("netty")
    testRuntime("junit5")
    processing {
        incremental(true)
        annotations("com.altastata.*")
    }
}
