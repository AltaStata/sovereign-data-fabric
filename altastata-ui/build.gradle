    }
*/

    launcher {
        noConsole = false
        jvmArgs = [
                '--module-path', '{{APP_HOME}}/javafxlib',
                '--add-modules', 'javafx.controls,javafx.graphics,javafx.media,javafx.swing'
        ]
    }

    jpackage {
        jvmArgs = [
                '--module-path', '{{BIN_DIR}}/javafxlib',
                '--add-modules', 'javafx.controls,javafx.graphics,javafx.media,javafx.swing',
                '-Dfile.encoding=UTF-8',
                '-Duser.language=en',
                '-Duser.country=US'
        ]

        def currentOs = org.gradle.internal.os.OperatingSystem.current()
        def imgType = currentOs.windows ? 'ico' : currentOs.macOsX ? 'icns' : 'png'
        // Absolute paths: jpackage CWD is repo root from Git Bash ./gradlew, but
        // the module dir from gradlew.bat / PowerShell. Relative prefixes break one of them.
        def iconFile = file("src/main/resources/images/altastata-logo.$imgType")
        def resourceDir = file("src/main/resources")

        // Windows MSI ProductVersion: major/minor 0-255, build 0-65535.
        // Date tags like 2026.07.20 exceed that; map to 26.7.20 for jpackage only.
        // UI still shows the full VERSION via version.properties.
        def jpackageAppVersion = version.toString()
        if (currentOs.windows) {
            def parts = jpackageAppVersion.tokenize('.')
            if (parts.size() >= 3 && parts[0].isInteger() && parts[0].toInteger() > 255) {
                jpackageAppVersion = "${parts[0].toInteger() % 100}.${parts[1].toInteger()}.${parts[2].toInteger()}"
            }
        }

        imageOptions += ['--icon', iconFile.absolutePath]
        imageOptions += ['--app-version', jpackageAppVersion]
        installerOptions += ['--resource-dir', resourceDir.absolutePath]
        installerOptions += ['--vendor', 'AltaStata Inc.']
        installerOptions += ['--app-version', jpackageAppVersion]
        installerOptions += ['--description', 'AltaStata Cloud File Explorer']

        if (currentOs.windows) {
            installerOptions += ['--win-per-user-install', '--win-dir-chooser', '--win-menu', '--win-shortcut'/*, '--win-console' */]
        } else if (currentOs.linux) {
            installerOptions += ['--type', 'rpm', '--linux-package-name', 'AltaStataUI', '--linux-shortcut']
        } else if (currentOs.macOsX) {
            installerOptions += ['--mac-package-name', 'AltaStataUI']
        }
    }

    tasks.runtime.doLast {
        def currentOs = org.gradle.internal.os.OperatingSystem.current()

        println "Copying files from src/main/resources to $buildDir/image/lib"

        copy {
            from('src/main/resources/')
            into("$buildDir/image/lib")
        }

        println "Copying files from storage to $buildDir/image"

        copy {
            from('.') { // Start from the current directory
                include 'storage/**/*' // This includes all files and subdirectories within storage
            }
            into("$buildDir/image")
        }

        if (currentOs.isMacOsX()) {
            copyJavaFxJars("$buildDir/image/lib", "$buildDir/image/javafxlib", '*javafx*mac*.jar')
        } else if (currentOs.isWindows()) {
            copyJavaFxJars("$buildDir/image/lib", "$buildDir/image/javafxlib", '*javafx*win*.jar')
        } else if (currentOs.isLinux()) {
            handleLinuxSpecificTasks("$buildDir/image", "lib")
        }
    }

    tasks.jpackage.doFirst {
        def currentOs = org.gradle.internal.os.OperatingSystem.current()
        def basePath = currentOs.windows ? project.name : currentOs.linux ? "$project.name/lib" : "${project.name}.app/Contents"

        println "Copying files from src/main/resources to $buildDir/jpackage/$basePath/app"

        copy {
            from('src/main/resources')
            into("$buildDir/jpackage/$basePath/app")
        }

        println "Copying files from storage to $buildDir/jpackage/$basePath"

        copy {
            from('.') { // Start from the current directory
                include 'storage/**/*' // This includes all files and subdirectories within storage
            }
            into("$buildDir/jpackage/$basePath")
        }

        if (currentOs.isMacOsX()) {
            copyJavaFxJars("$buildDir/jpackage/$basePath/app", "$buildDir/jpackage/$basePath/javafxlib", '*javafx*mac*.jar')
        } else if (currentOs.isWindows()) {
            copyJavaFxJars("$buildDir/jpackage/$basePath/app", "$buildDir/jpackage/$basePath/javafxlib", '*javafx*win*.jar')
        }
        else if (currentOs.isLinux()) {
            handleLinuxSpecificTasks("$buildDir/jpackage/$basePath", "javafxlib")
        }
    }
}