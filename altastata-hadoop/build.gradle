plugins {
    id 'scala'
    id 'distribution'
    id 'java-library'
    id("com.gradleup.shadow") version "8.3.6"
}

group = 'com.altastata'
version = rootProject.file('VERSION').text.trim()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(
                org.gradle.internal.os.OperatingSystem.current().isWindows() ? 17 : 8
        )
    }
}

tasks.withType(ScalaCompile) {
    scalaCompileOptions.additionalParameters = ['-release:8']
}

repositories {
    mavenCentral()
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
}

dependencies {

    api(project(':altastata-core')) {
        exclude group: 'com.twitter'
    }

    implementation("org.apache.hadoop:hadoop-common:3.3.6") {
        exclude group: 'org.eclipse.jetty'
        exclude group: 'javax.servlet'
        exclude group: 'org.apache.zookeeper'
        exclude group: 'org.apache.curator'
        exclude group: 'com.sun.jersey'
        exclude group: 'org.apache.kerby'
        exclude group: 'com.nimbusds'
        exclude group: 'org.conscrypt'
    }
    
    implementation("org.apache.hadoop:hadoop-annotations:3.3.6")
    
    implementation("org.apache.hadoop:hadoop-client:3.3.6") {
        exclude group: 'org.apache.hadoop', module: 'hadoop-yarn-api'
        exclude group: 'org.apache.hadoop', module: 'hadoop-yarn-client'
        exclude group: 'org.apache.hadoop', module: 'hadoop-yarn-common'
        exclude group: 'org.apache.hadoop', module: 'hadoop-mapreduce-client-core'
        exclude group: 'org.apache.hadoop', module: 'hadoop-mapreduce-client-jobclient'
        exclude group: 'org.eclipse.jetty'
        exclude group: 'javax.servlet'
    }

    testImplementation 'junit:junit:4.12'
}

sourceSets {
    main.scala.srcDirs = ["src/main/scala", "src/main/java"]
    main.java.srcDirs = []
}

distributions {
    main {
        contents {
            into('lib') {
                from jar
                from(project.configurations.runtimeClasspath)
            }
        }
    }
}

// Property to control exclusion of org.bouncycastle dependencies
def excludeBouncyCastle = project.hasProperty('excludeBouncyCastle') && project.property('excludeBouncyCastle') == 'true'

def minimalBuild = project.hasProperty('minimalBuild') && project.property('minimalBuild') == 'true'

// Property to control Dataproc-specific exclusions (Netty conflicts)
def dataprocBuild = project.hasProperty('dataprocBuild') && project.property('dataprocBuild') == 'true'

shadowJar {
    archiveBaseName = 'altastata-hadoop'
    archiveClassifier = 'uber'
    zip64 true
    mergeServiceFiles()
    
    // Essential exclusions to prevent conflicts
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/services/javax.annotation.processing.Processor'
    // Bouncy Castle 1.85+ ships multi-release classes (incl. Java 25 / major 69).
    // Shadow's ASM cannot rewrite those; base classes (Java 8) are enough at runtime.
    exclude 'META-INF/versions/**'
    
    // Only exclude Netty if building for Dataproc specifically
    if (dataprocBuild) {
        dependencies {
            // Exclude Netty to prevent version conflicts in Dataproc
            exclude(dependency('io.netty:netty-all'))
            exclude(dependency('io.netty:netty-buffer'))
            exclude(dependency('io.netty:netty-common'))
            exclude(dependency('io.netty:netty-transport'))
            exclude(dependency('io.netty:netty-codec'))
            exclude(dependency('io.netty:netty-handler'))
            
            // Exclude conflicting logging implementations
            exclude(dependency('org.slf4j:slf4j-log4j12'))
            exclude(dependency('log4j:log4j'))
            exclude(dependency('org.apache.logging.log4j:log4j-core'))
            exclude(dependency('org.apache.logging.log4j:log4j-api'))
        }
    }
    
    if (excludeBouncyCastle) {
        dependencies {
            exclude(dependency('org.bouncycastle:bcprov-jdk18on'))
            exclude(dependency('org.bouncycastle:bcpkix-jdk18on'))
        }
    }
    
    if (minimalBuild) {
        dependencies {
            // Keep gRPC for Google Cloud compatibility
            // exclude(dependency('io.grpc:.*'))
            exclude(dependency('org.conscrypt:.*'))
            exclude(dependency('org.eclipse.jetty:.*'))
            exclude(dependency('org.apache.zookeeper:.*'))
            exclude(dependency('org.apache.curator:.*'))
            exclude(dependency('com.sun.jersey:.*'))
            exclude(dependency('org.apache.kerby:.*'))
            exclude(dependency('com.nimbusds:.*'))
        }
    }
    
    relocate 'com.google.common', 'altastata.shaded.com.google.common'
    relocate 'org.apache.commons', 'altastata.shaded.org.apache.commons'
    relocate 'com.google.protobuf', 'altastata.shaded.com.google.protobuf'
}

task copyDeps(type: Copy) {
    into "$buildDir/libs_dependency"
    from configurations.runtimeClasspath
}

// ignore this task
tasks.named('distZip').configure {
    enabled = false
}

// ignore this task
tasks.named('distTar').configure {
    enabled = false
}
