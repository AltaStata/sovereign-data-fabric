// Add Javadoc configuration
tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    
    // Include Scala classes in classpath
    classpath += files(sourceSets.main.scala.classesDirectory)
    
    // Add Scala dependencies to classpath
    classpath += configurations.compileClasspath
    
    // Configure Javadoc to work with Scala
    options.addStringOption('source', '8')
    
    // Set the output directory
    destinationDir = file("${buildDir}/docs/javadoc")
    
    // Public Java surface: high-level API + low-level CloudFile model
    source = fileTree('src/main/java') {
        include 'com/altastata/api/**/*.java'
        include 'com/altastata/filesystem/common/**/*.java'
    }
    
    // Exclude everything else
    exclude '**/*.scala'
    exclude '**/com/altastata/demo/**'
    exclude '**/com/altastata/cloud/**'
    exclude '**/com/altastata/crypto/**'
    exclude '**/com/altastata/utils/**'
}

// Public low-level Scala API only (not internal securecloud handlers).
// Entry: build/docs/scaladoc/com/altastata/filesystem/securecloud/index.html
tasks.named('scaladoc') {
    source = fileTree('src/main/scala') {
        include 'com/altastata/filesystem/FileSystemModel.scala'
        include 'com/altastata/filesystem/securecloud/SecureCloudFileSystemModel.scala'
        include 'com/altastata/filesystem/securecloud/SecureCloudStream.scala'
    }
    doLast {
        def entry = 'com/altastata/filesystem/securecloud/index.html'
        file("${destinationDir}/index.html").text = """<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=${entry}">
  <link rel="canonical" href="${entry}">
  <title>AltaStata Scala API — securecloud</title>
</head>
<body>
  <p><a href="${entry}">securecloud</a> (FileSystemModel, Streams)</p>
</body>
</html>
"""
        println "Scaladoc entry: ${destinationDir}/${entry}"
    }
}

// Make Javadoc task depend on Scala compilation
tasks.named('javadoc') {
    dependsOn 'compileScala'
    doLast {
        println "Javadoc generated at: ${destinationDir}"
    }
}

// Add this task at the end of the file
task runIBMCloudObjectStorageDemo(type: JavaExec) {
    description = 'Run IBM Cloud Object Storage Demo Application'
    group = 'application'
    
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.altastata.cloud.ibm.IBMCloudObjectStorageDemo'
    
    // Enable console input if needed
    standardInput = System.in
}

// Add MinIO demo task
task runMinIODemo(type: JavaExec) {
    description = 'Run MinIO Demo Application'
    group = 'application'
    
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.altastata.cloud.minio.MinIODemo'
    
    // Enable console input if needed
    standardInput = System.in
}

// SoftHSM2 Docker test for HPCS development
task runSoftHSM2Test(type: Exec) {
    description = 'Run IBMHPCSKeyManager test in Docker'
    group = 'verification'
    dependsOn compileTestScala
    
    workingDir = file('src/test/docker/softhsm2')
    commandLine 'bash', 'run-scala-test.sh'
}

task printTestClasspath {
    description = 'Print test runtime classpath'
    group = 'help'
    doLast {
        println sourceSets.test.runtimeClasspath.asPath
    }
}

task runGrep11CreateKey(type: JavaExec, description: 'Run GREP11 create-key (YAML: -PyamlPath=, save priv blob: -PsavePrivBlob=)') {
    group = 'application'
    mainClass = 'com.altastata.cloud.ibm.Grep11CreateKeyMain'
    classpath = sourceSets.main.runtimeClasspath
    if (project.hasProperty('yamlPath')) {
        args project.property('yamlPath').toString()
    } else {
        args "${project.projectDir}/grep11client.yaml"
    }
    if (project.hasProperty('savePrivBlob')) {
        args project.property('savePrivBlob').toString()
    }
}

task runHPCSCreateKey(type: JavaExec, description: 'Create RSA key in HPCS (GREP11) — default sandbox amazon.rsa.hpcs.hpcsdev') {
    group = 'application'
    mainClass = 'com.altastata.cloud.ibm.HPCSCreateKey'
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs '--add-opens', 'jdk.crypto.cryptoki/sun.security.pkcs11=ALL-UNNAMED'
    if (project.hasProperty('accountDir')) {
        args project.property('accountDir').toString()
    }
    if (project.hasProperty('hpcsUser')) {
        args project.property('hpcsUser').toString()
    }
}

task runHPCSGrep11EncryptDecryptSignVerifyTest(type: JavaExec, description: 'Standalone test: encrypt/decrypt and sign/verify with GREP11 key (GREP11_YAML env; arg: account dir)') {
    group = 'verification'
    mainClass = 'com.altastata.cloud.ibm.hpcs.HPCSGrep11EncryptDecryptSignVerifyTest'
    classpath = sourceSets.test.runtimeClasspath
    if (project.hasProperty('accountDir')) {
        args project.property('accountDir').toString()
    }
}

task runHPCSAltaStataCryptoTest(type: JavaExec, description: 'Standalone test: AltaStata crypto (encryptProperty, getAndDecryptProperty, encryptArrayWithRSA, sign/verify) with HPCS') {
    group = 'verification'
    mainClass = 'com.altastata.cloud.ibm.hpcs.HPCSAltaStataCryptoTest'
    classpath = sourceSets.test.runtimeClasspath
    if (project.hasProperty('accountDir')) {
        args project.property('accountDir').toString()
    }
}

test {
    java {
        // No exclusions needed since CephCILogon files have been deleted
    }

    // Bulk Azure IT (1100 files × metadata/attrs/chunks) needs more than the default ~512MB heap;
    // download phase OOM'd without this (see bulk-no-metadata-ui-off.log).
    maxHeapSize = '4g'
    // Run ScalaTest tests
    testLogging {
        events "passed", "skipped", "failed", "standardOut"
        showStandardStreams = true
        exceptionFormat "full"
    }
    
    // Only include actual ScalaTest/JUnit tests (ending in *SimulationTest, *Spec, etc.)
    // Exclude Scala objects with main() that have "Test" in their name
    scanForTestClasses = false
    include '**/*SimulationTest.class'
    include '**/*Spec.class'
    include '**/*Tests.class'
}
