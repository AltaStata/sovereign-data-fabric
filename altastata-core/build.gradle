tasks.test.dependsOn compileModuleInfo
tasks.jar.dependsOn compileModuleInfo

// Build task dependencies
tasks.build {
    dependsOn tasks.withType(ScalaCompile), compileModuleInfo
}

java {
    modularity.inferModulePath = true
}
