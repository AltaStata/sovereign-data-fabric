plugins {
    id 'scala'
    id 'java-library'
    id 'project-report'
    id 'com.google.protobuf' version '0.9.4'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(
                org.gradle.internal.os.OperatingSystem.current().isWindows() ? 17 : 8
        )
    }
}

tasks.withType(ScalaCompile).configureEach { task ->
    task.scalaCompileOptions.additionalParameters = ['-release:8']
    exclude '**/com/altastata/cloud/ibm/Grep11*.java'
}

// Check if the "noGCP" flag is passed (default: false)
def noGCP = project.hasProperty('noGCP') || System.getenv('NO_GCP') == 'true'

htmlDependencyReport {
    projects = project.allprojects
}

repositories {
    mavenCentral()
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
}

dependencies {
    api "org.scala-lang:scala-library:2.12.20"
	api "commons-io:commons-io:2.17.0"
    api 'org.apache.commons:commons-lang3:3.18.0'
	api "org.slf4j:slf4j-api:2.0.16"
    api "ch.qos.logback:logback-classic:1.3.14"
    api "ch.qos.logback:logback-core:1.3.14"

    //api "org.slf4j:slf4j-simple:2.0.16"
    api "org.json:json:20240303"
    
    api 'com.azure:azure-storage-blob:12.29.0'
    api 'com.azure:azure-storage-queue:12.24.0'

    if (!noGCP) {
        api 'com.google.cloud:google-cloud-storage:2.48.1'
        api 'com.google.cloud:google-cloud-kms:2.56.0'
        //api 'com.google.cloud:google-cloud-pubsub:1.133.1'
    }

    api 'software.amazon.awssdk:s3:2.29.39'
    api 'software.amazon.awssdk:sqs:2.29.39'
    api 'software.amazon.awssdk:sns:2.29.39'
    api 'software.amazon.awssdk:sts:2.29.39'
    api 'software.amazon.awssdk:iam:2.29.39'
    api 'software.amazon.awssdk:kms:2.29.39'
    api 'software.amazon.awssdk:cognitoidentityprovider:2.29.39'
    api 'software.amazon.awssdk:cognitoidentity:2.29.39'
    api 'software.amazon.awssdk:apache-client:2.29.39'

    // old version due to Databricks conflict
    api 'io.circe:circe-core_2.12:0.14.0-M1'
    api 'io.circe:circe-parser_2.12:0.14.0-M1'
    api 'io.circe:circe-generic_2.12:0.14.0-M1'

	api "org.bouncycastle:bcprov-jdk18on:1.85"
	api "org.bouncycastle:bcpkix-jdk18on:1.85"

	implementation "com.bettercloud:vault-java-driver:2.0.0"

	// In-process bounded cache (small-file ciphertext, encrypted metadata, encrypted data attributes).
	// Pinned to 2.9.3: last Caffeine release that supports Java 8 (3.x needs Java 11+ and
	// altastata-core compiles Scala with -release:8 / Mac+Linux toolchain JDK 8).
	api 'com.github.ben-manes.caffeine:caffeine:2.9.3'

	// GREP11 (gRPC) for HPCS - Java implementation (no .so)
	// When GCP is present it already brings grpc-netty-shaded; Gradle resolves to one version (no duplicate). When -PnoGCP we need these for GREP11.
	api "io.grpc:grpc-netty-shaded:1.75.0"
	api "io.grpc:grpc-stub:1.75.0"
	api "io.grpc:grpc-protobuf:1.75.0"
	api "com.google.protobuf:protobuf-java:4.28.3"
	implementation "org.yaml:snakeyaml:2.2"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation 'org.scalatest:scalatest_2.12:3.2.19'
    testImplementation 'org.scalatestplus:junit-4-13_2.12:3.2.2.0' // ScalaTest JUnit runner
}

protobuf {
    protoc { artifact = "com.google.protobuf:protoc:3.25.1" }
    plugins { grpc { artifact = "io.grpc:protoc-gen-grpc-java:1.69.0" } }
    generateProtoTasks {
        all().configureEach { task -> task.plugins { grpc {} } }
    }
}

sourceSets {
    main {
        scala {
            srcDirs = ['src/main/scala', 'src/main/java']

            // Exclude module-info.java from Scala compilation
            exclude '**/module-info.java'

            // Exclude all Java files at the following packages
            exclude '**/com/altastata/cloud/azure/**'
            exclude '**/com/altastata/cloud/google/GooglePubSub**'

                // Conditionally exclude Google Storage Manager for GraalVM
            if (noGCP) {
                exclude '**/com/altastata/cloud/google/*.scala'
            }

            // TODO: for Android uncomment the following lines
//            exclude '**/cognito/helper/**'
//            exclude '**/android/util/**Log*'
        }
        // Generated proto/gRPC + GREP11 Java only (compileJava runs first; GREP11 lives in java-hpcs to avoid compiling Scala-dependent Java)
        java.srcDirs = ["$buildDir/generated/source/proto/main/java", "$buildDir/generated/source/proto/main/grpc", "src/main/java-hpcs"]
    }
    if (noGCP) {
        test {
            scala {
                exclude '**/com/altastata/cloud/google/**'
            }
        }
    }
}

// Ensure proto is generated before compileJava (required after clean when java.srcDirs points at generated dirs)
tasks.named('compileJava').configure { dependsOn tasks.generateProto }

// Do not run tests as part of build (avoids compileTestJava/test failures). Run tests explicitly with: gradle test
gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(tasks.named('build').get())) {
        tasks.named('test').configure { enabled = false }
        tasks.named('compileTestJava').configure { enabled = false }
    }
}

