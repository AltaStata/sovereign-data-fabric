// Compile module-info.java
task compileModuleInfo(type: JavaCompile) {
    source = file('src/main/java/module-info.java')
    destinationDir = file("$buildDir/classes/scala/main")
    classpath = sourceSets.main.compileClasspath

    options.compilerArgs = [
            '--module-path', (sourceSets.main.output.files + sourceSets.main.compileClasspath.files).join(File.pathSeparator),
            '--add-modules', 'java.desktop'
    ]
}

// Dependencies for tasks
